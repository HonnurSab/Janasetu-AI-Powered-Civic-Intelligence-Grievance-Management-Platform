<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janasetu GIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Serif+Kannada:wght@500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img class="brandLogo" src="/static/assets/janasetu-logo.png" alt="Janasetu"><div><strong>Janasetu</strong><small>ಜನಸೇತು · Karnataka Civic Intelligence</small></div></div>
    <div class="rolebox"><label>SECURE PORTAL</label><div id="roleBadge" class="roleBadge">Authenticated</div></div>
    <nav id="nav"></nav>
    <div class="profile">
      <div class="avatar">ಜ</div>
      <div class="profileText"><b id="profileName">Resident</b><small id="profileSub">Authenticated</small></div>
      <a class="logout" href="/logout">Logout</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <span class="eyebrow" id="eyebrow">JANASETU</span>
        <h1 id="title">Civic Intelligence</h1>
        <p id="subtitle">Privacy-aware service delivery with GIS intelligence.</p>
      </div>
      <div class="topActions">
        <button class="languageToggle" id="langToggleBtn" type="button"><span id="langLabel">ಕನ್ನಡ</span></button>
        <button class="refresh" id="refreshBtn" type="button">↻ Refresh</button>
      </div>
    </header>
    <div id="app"></div>
  </main>
</div>

<div id="drawerOverlay" class="drawerOverlay" data-action="close-drawer"></div>
<aside id="complaintDrawer" class="complaintDrawer" role="dialog" aria-label="Complaint case file">
  <div class="drawerHead">
    <div><span class="drawerId" id="drawerHeadId">CASE</span><h3 id="drawerHeadTitle">Category</h3></div>
    <button class="drawerClose" type="button" data-action="close-drawer" aria-label="Close">✕</button>
  </div>
  <div class="drawerTabs">
    <button class="drawerTab active" type="button" data-action="drawer-tab" data-tab="details">Details</button>
    <button class="drawerTab" type="button" data-action="drawer-tab" data-tab="timeline">Timeline</button>
    <button class="drawerTab" type="button" data-action="drawer-tab" data-tab="attachments">Evidence</button><button class="drawerTab" type="button" data-action="drawer-tab" data-tab="resolution">Resolution</button>
  </div>
  <div class="drawerBody" id="drawerBody"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
